services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erix}
      POSTGRES_USER: ${POSTGRES_USER:-erix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erix} -d ${POSTGRES_DB:-erix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erix}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      UPLOAD_DIR: /data/uploads
      MODEL_PATH: /app/models/reimbursement-risk.joblib
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      RISK_REVIEW_THRESHOLD: ${RISK_REVIEW_THRESHOLD:-0.35}
      LOW_OCR_CONFIDENCE_THRESHOLD: ${LOW_OCR_CONFIDENCE_THRESHOLD:-0.65}
    volumes:
      - uploaded_documents:/data/uploads
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      STREAMLIT_API_URL: http://api:8000
      STREAMLIT_API_KEY: ${API_KEY:?Set API_KEY in .env}
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_documents:
